<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hardware-Aware Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Hardware-Aware Visualizer</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-id="cache">1 · Cache lines</button>
      <button class="tab" data-id="coherence">2 · False sharing</button>
      <button class="tab" data-id="reduction">3 · GPU reduction</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2 id="scene-title">Cache lines &amp; access patterns</h2>
      <p id="scene-subtitle" class="subtitle"></p>

      <div class="controls" id="controls"></div>

      <label class="preset-label">Presets</label>
      <select id="presets" class="preset-select"></select>

      <div class="hint">
        <strong>Keys</strong>
        <span><kbd>Space</kbd> play/pause</span>
        <span><kbd>→</kbd> step</span>
        <span><kbd>R</kbd> reset</span>
        <span><kbd>1</kbd>–<kbd>3</kbd> scenes</span>
      </div>

      <div class="reimplement-note">
        The hardware model is yours to write — the functions in
        <code>js/scenes/*.js</code> are marked <code>REIMPLEMENT (you)</code>.
      </div>
    </aside>

    <section class="stage-wrap">
      <canvas id="stage"></canvas>
      <div class="transport">
        <button id="play">Play ▶</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
        <label class="speed">speed
          <input type="range" id="speed" min="30" max="400" step="10" value="90" />
        </label>
        <div class="legend" id="legend"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
